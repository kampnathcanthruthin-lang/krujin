<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฝึกพูดภาษาจีน</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f0fdf4);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 35px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 520px;
      width: 90%;
    }
    h1 { color: #0284c7; font-size: 24px; margin-bottom: 5px; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
    
    /* กล่องสำหรับคุณครูกรอกเฉพาะประโยคจีน */
    .teacher-box {
      background-color: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .teacher-box label { font-weight: bold; color: #334155; font-size: 14px; display: block; margin-bottom: 5px; }
    .teacher-box input {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .teacher-box button {
      margin-top: 12px;
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      font-size: 16px;
    }
    .teacher-box button:hover { background-color: #0369a1; }

    /* กล่องโจทย์ให้เด็กอ่าน */
    .target-box {
      background-color: #e0f2fe;
      border: 3px dashed #0284c7;
      border-radius: 18px;
      padding: 20px;
      margin: 15px 0;
    }
    .chinese { font-size: 42px; color: #0f172a; margin: 5px 0; font-weight: bold; word-break: break-all; }

    /* กล่องสีเขียวเฉลย (แสดงเมื่อพูดถูก) */
    .reveal-box {
      display: none;
      background-color: #dcfce7;
      border: 2px solid #86efac;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      animation: bounceIn 0.5s;
    }
    .meaning { font-size: 18px; color: #15803d; font-weight: bold; margin-bottom: 5px; }
    .success-title { font-size: 22px; color: #15803d; font-weight: bold; margin-bottom: 8px; }

    /* กล่องสีแดงแจ้งเตือนเมื่อพูดผิด */
    .error-box {
      display: none;
      background-color: #fee2e2;
      border: 2px solid #fca5a5;
      border-radius: 14px;
      padding: 15px;
      margin-top: 15px;
      color: #b91c1c;
      font-size: 18px;
      font-weight: bold;
      animation: shake 0.4s;
    }

    .btn-mic {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 16px 30px;
      font-size: 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(34,197,94,0.3);
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }
    .btn-mic:hover { background-color: #16a34a; transform: scale(1.02); }
    .btn-mic.listening { background-color: #ef4444; animation: pulse 1.5s infinite; }

    .result-box { margin-top: 15px; font-size: 16px; color: #334155; min-height: 30px; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
    @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  </style>
</head>
<body>

<div class="container">
  <h1>👩‍🏫 ระบบฝึกพูดภาษาจีน</h1>
  <div class="subtitle">พิมพ์ประโยค แล้วให้เด็กๆ อ่านออกเสียงผ่านไมค์</div>

  <!-- โซนกรอกประโยคภาษาจีนของคุณครู (ลบช่องคำแปลออกแล้ว) -->
  <div class="teacher-box">
    <label>✏️ พิมพ์ประโยคภาษาจีนที่ต้องการ:</label>
    <input type="text" id="customChinese" value="今天老师很好。">
    <button onclick="setCustomTarget()">ตั้งเป็นโจทย์ให้เด็กอ่าน</button>
  </div>

  <!-- โซนโจทย์ตัวอักษรจีนให้เด็กอ่าน -->
  <div class="target-box">
    <div style="font-size: 14px; color: #0369a1; font-weight: bold;">ประโยคฝึกอ่านสำหรับนักเรียน:</div>
    <div class="chinese" id="targetChineseDisplay">今天老师很好。</div>
  </div>

  <button class="btn-mic" id="micBtn" onclick="toggleListening()">🎤 กดเพื่อเริ่มพูด</button>

  <div class="result-box" id="resultText">กดปุ่มไมค์ แล้วอ่านออกเสียงตามตัวอักษรจีนด้านบนครับ</div>
  
  <!-- กล่องสีเขียวเฉลย (แสดงเมื่อพูดถูก) -->
  <div class="reveal-box" id="revealBox">
    <div class="success-title">🎉 ยอดเยี่ยม! อ่านถูกต้องแล้ว! 🌟</div>
    <div class="meaning" id="targetMeaningDisplay">โจทย์: 今天老师很好。</div>
    <button style="margin-top: 10px; background: #15803d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;" onclick="speakTarget()">🔊 ฟังเสียงเจ้าของภาษา</button>
  </div>

  <!-- กล่องสีแดงแจ้งเตือน (แสดงเมื่อพูดผิดหรือพูดไม่ครบ) -->
  <div class="error-box" id="errorBox">
    ❌ อ่านออกเสียงยังไม่ถูกต้อง ลองใหม่อีกครั้ง!
  </div>
</div>

<script>
  let targetSentence = "今天老师很好。";
  let isListening = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = function(event) {
      const spokenText = event.results[0][0].transcript;
      document.getElementById('resultText').innerHTML = `ระบบได้ยินเด็กพูด: <b style="color:#0284c7">"${spokenText}"</b>`;
      
      // ทำความสะอาดข้อความ ตัดช่องว่างและเครื่องหมายวรรคตอนออก
      const cleanTarget = targetSentence.replace(/[\s。！？，,.;]/g, "").trim();
      const cleanSpoken = spokenText.replace(/[\s。！？，,.;]/g, "").trim();

      // ตรวจสอบความถูกต้องแบบเข้มงวด (ต้องออกเสียงตรงกันเป๊ะตามโจทย์)
      if (cleanSpoken === cleanTarget) {
        // ถ้าพูดถูก
        document.getElementById('revealBox').style.display = 'block';
        document.getElementById('errorBox').style.display = 'none';
        document.getElementById('resultText').innerText = '';
      } else {
        // ถ้าพูดผิด หรือพูดไม่ครบ
        document.getElementById('revealBox').style.display = 'none';
        document.getElementById('errorBox').style.display = 'block';
      }
    };

    recognition.onend = function() {
      isListening = false;
      const btn = document.getElementById('micBtn');
      btn.innerText = '🎤 กดเพื่อเริ่มพูด';
      btn.classList.remove('listening');
    };
  } else {
    alert("เบราว์เซอร์นี้ไม่รองรับการแปลงเสียงพูด แนะนำให้ใช้ Google Chrome ครับ");
  }

  // ฟังก์ชันอัปเดตโจทย์ที่คุณครูกรอก
  function setCustomTarget() {
    const cInput = document.getElementById('customChinese').value.trim();

    if (cInput === "") {
      alert("กรุณากรอกประโยคภาษาจีนครับ");
      return;
    }

    targetSentence = cInput;
    document.getElementById('targetChineseDisplay').innerText = targetSentence;
    document.getElementById('targetMeaningDisplay').innerText = "โจทย์: " + targetSentence;
    
    // ซ่อนกล่องแจ้งเตือนทั้งหมดเมื่อเปลี่ยนโจทย์ใหม่
    document.getElementById('revealBox').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('resultText').innerText = 'เปลี่ยนโจทย์เรียบร้อย! ให้เด็กๆ ลองกดไมค์อ่านได้เลย';
  }

  // ฟังก์ชันควบคุมไมค์
  function toggleListening() {
    if (!recognition) return;
    const btn = document.getElementById('micBtn');
    
    if (!isListening) {
      recognition.start();
      isListening = true;
      btn.innerText = '🛑 กำลังฟังเสียง... พูดเลย!';
      btn.classList.add('listening');
      document.getElementById('revealBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('resultText').innerText = 'กำลังฟังเสียง...';
    } else {
      recognition.stop();
    }
  }

  // ฟังก์ชันกดฟังเสียงเจ้าของภาษา
  function speakTarget() {
    const utterance = new SpeechSynthesisUtterance(targetSentence);
    utterance.lang = 'zh-CN';
    window.speechSynthesis.speak(utterance);
  }
</script>

</body>
</html>
